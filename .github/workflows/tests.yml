name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: Offline demo (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests without site packages
        run: python -S -m unittest discover -s tests -v
      - name: Run the offline demo
        run: python -S examples/demo.py
